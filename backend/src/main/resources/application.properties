spring.application.name=backend
#yandex
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

yandex.bucket=${YANDEX_BUCKET}
yandex.access-key=${YANDEX_ACCESS_KEY}
yandex.secret-key=${YANDEX_SECRET_KEY}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#clickhouse


# SQL init configuration
spring.sql.init.mode=always
#minio
minio.endpoint=http://minio:9000
minio.access-key=minioadmin
minio.secret-key=password
minio.bucket-name=bucket
minio.secure=false

# Async configuration
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=video-converter-

# ???????????? ?????? ?????
spring.servlet.multipart.max-file-size=5GB
spring.servlet.multipart.max-request-size=5GB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}

# ???????? ??? Tomcat - ???????????? ?????????
server.tomcat.connection-timeout=600000
server.tomcat.max-swallow-size=5GB
server.tomcat.max-http-form-post-size=5GB

# ????????? ????????? ??? ????????? ??????? ????????
server.tomcat.max-keep-alive-requests=100
server.tomcat.keep-alive-timeout=60000