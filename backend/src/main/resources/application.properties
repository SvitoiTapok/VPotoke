spring.application.name=backend

# Yandex Object Storage
yandex.bucket=${YANDEX_BUCKET:vpotoke-videos}
yandex.access-key=${YANDEX_ACCESS_KEY:}
yandex.secret-key=${YANDEX_SECRET_KEY:}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/myapp_db}
spring.datasource.username=${DB_USER:myapp_user}
spring.datasource.password=${DB_PASSWORD:myapp_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

# Async configuration
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=video-converter-